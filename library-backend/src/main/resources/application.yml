spring:
  application:
    name: library-management-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:"your database username"}
    password: ${SPRING_DATASOURCE_PASSWORD:"your database password"}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:ChangeThisToAVeryLongSecretKeyForHS256AlgorithmMinimum256BitsPleaseUseEnvVarInProd}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  borrow:
    default-days: ${BORROW_DEFAULT_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
